<svg width="640" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <rect width="640" height="560" fill="#FFFFFF"/>
  <g font-size="21" fill="#3B3230">
    <!-- 1 ルール -->
    <rect x="16" y="16" width="608" height="76" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <circle cx="58" cy="54" r="20" fill="#8C6F45"/><text x="58" y="62" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">1</text>
    <text x="92" y="50" font-weight="700">お店の返信のルールを作る</text>
    <text x="92" y="77" font-size="16" fill="#5E524D">最初の1回だけ。口調・署名・書かないこと</text>
    <rect x="530" y="38" width="76" height="32" rx="16" fill="#F5EBE7" stroke="#96594F"/><text x="568" y="60" text-anchor="middle" font-size="16" fill="#96594F" font-weight="700">自分</text>
    <path d="M320 92v22" stroke="#948072" stroke-width="2.5"/><path d="M312 108l8 10 8-10" fill="none" stroke="#948072" stroke-width="2.5"/>
    <!-- 2 分岐 -->
    <text x="320" y="146" text-anchor="middle" font-size="18" fill="#5E524D">口コミの内容で分かれます</text>
    <rect x="16" y="160" width="296" height="168" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <text x="164" y="192" text-anchor="middle" font-weight="700">高評価（星4〜5）</text>
    <rect x="36" y="208" width="256" height="48" rx="6" fill="#FFFFFF" stroke="#948072"/>
    <text x="164" y="238" text-anchor="middle" font-size="18">口コミを貼る</text>
    <path d="M164 256v10" stroke="#948072" stroke-width="2.5"/>
    <rect x="36" y="268" width="256" height="48" rx="6" fill="#E9EEF2" stroke="#4A6478"/>
    <text x="164" y="298" text-anchor="middle" font-size="18" fill="#35505F">AIが下書きを出す</text>

    <rect x="328" y="160" width="296" height="168" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <text x="476" y="192" text-anchor="middle" font-weight="700">低評価・不満（星1〜3）</text>
    <rect x="348" y="208" width="256" height="48" rx="6" fill="#F5EBE7" stroke="#96594F"/>
    <text x="476" y="238" text-anchor="middle" font-size="18" fill="#96594F" font-weight="700">事実のメモを書く（自分）</text>
    <path d="M476 256v10" stroke="#948072" stroke-width="2.5"/>
    <rect x="348" y="268" width="256" height="48" rx="6" fill="#E9EEF2" stroke="#4A6478"/>
    <text x="476" y="298" text-anchor="middle" font-size="18" fill="#35505F">AIが下書きを出す</text>

    <path d="M164 328v22M476 328v22" stroke="#948072" stroke-width="2.5"/>
    <path d="M164 350h312" stroke="#948072" stroke-width="2.5"/>
    <path d="M320 350v18" stroke="#948072" stroke-width="2.5"/><path d="M312 362l8 10 8-10" fill="none" stroke="#948072" stroke-width="2.5"/>
    <!-- 3 -->
    <rect x="16" y="376" width="608" height="76" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <circle cx="58" cy="414" r="20" fill="#8C6F45"/><text x="58" y="422" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">3</text>
    <text x="92" y="410" font-weight="700">事実を確かめて、自分の言葉に直す</text>
    <text x="92" y="437" font-size="16" fill="#5E524D">口コミにないことが足されていないか見る</text>
    <rect x="530" y="398" width="76" height="32" rx="16" fill="#F5EBE7" stroke="#96594F"/><text x="568" y="420" text-anchor="middle" font-size="16" fill="#96594F" font-weight="700">自分</text>
    <path d="M320 452v22" stroke="#948072" stroke-width="2.5"/><path d="M312 468l8 10 8-10" fill="none" stroke="#948072" stroke-width="2.5"/>
    <!-- 4 -->
    <rect x="16" y="482" width="608" height="62" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <circle cx="58" cy="513" r="20" fill="#8C6F45"/><text x="58" y="521" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">4</text>
    <text x="92" y="520" font-weight="700">自分で投稿する</text>
    <rect x="530" y="497" width="76" height="32" rx="16" fill="#F5EBE7" stroke="#96594F"/><text x="568" y="519" text-anchor="middle" font-size="16" fill="#96594F" font-weight="700">自分</text>
  </g>
</svg>
