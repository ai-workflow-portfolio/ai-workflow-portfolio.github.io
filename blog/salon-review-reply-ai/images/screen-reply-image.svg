<svg width="640" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <rect width="640" height="520" fill="#FFFFFF"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#5E524D">画面のイメージ（実際の表示とは、少し違うことがあります）</text>
  <!-- 画面の枠 -->
  <rect x="16" y="46" width="608" height="458" rx="10" fill="#F6F7F9" stroke="#B8BEC6" stroke-width="1.5"/>
  <rect x="16" y="46" width="608" height="48" rx="10" fill="#E8EBEF"/>
  <rect x="16" y="80" width="608" height="14" fill="#E8EBEF"/>
  <text x="40" y="77" font-size="20" font-weight="700" fill="#3B3230">クチコミを読む</text>
  <!-- クチコミカード -->
  <rect x="36" y="112" width="568" height="150" rx="8" fill="#FFFFFF" stroke="#D5D9DE"/>
  <circle cx="72" cy="146" r="16" fill="#D5D9DE"/>
  <text x="100" y="142" font-size="17" fill="#3B3230" font-weight="700">お客様（名前は表示されます）</text>
  <text x="100" y="164" font-size="16" fill="#E0A100" letter-spacing="2">★★☆☆☆</text>
  <text x="56" y="200" font-size="18" fill="#3B3230">予約の時間より、15分ほど待ちました。</text>
  <!-- 返信アイコン -->
  <rect x="526" y="206" width="62" height="40" rx="8" fill="#FFFFFF" stroke="#E53935" stroke-width="3"/>
  <path d="M547 232v-8h18v-6l12 10-12 10v-6z" fill="#5E524D"/>
  <circle cx="598" cy="206" r="14" fill="#E53935"/><text x="598" y="212" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="700">1</text>
  <!-- 入力欄 -->
  <rect x="36" y="284" width="568" height="150" rx="8" fill="#FFFFFF" stroke="#D5D9DE"/>
  <text x="56" y="316" font-size="16" fill="#5E524D">返信</text>
  <rect x="56" y="326" width="528" height="64" rx="6" fill="#FFFFFF" stroke="#E53935" stroke-width="3"/>
  <text x="70" y="354" font-size="17" fill="#8A8F96">ここに返信を入力します</text>
  <circle cx="584" cy="326" r="14" fill="#E53935"/><text x="584" y="332" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="700">2</text>
  <!-- 返信ボタン -->
  <rect x="496" y="398" width="88" height="30" rx="15" fill="#FFFFFF" stroke="#E53935" stroke-width="3"/>
  <text x="540" y="419" text-anchor="middle" font-size="16" fill="#1A5FB4" font-weight="700">返信</text>
  <circle cx="496" cy="398" r="14" fill="#E53935"/><text x="496" y="404" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="700">3</text>
  <!-- 審査 -->
  <text x="56" y="470" font-size="16" fill="#3B3230">押すと、Googleの審査のあとビジネスからの返信として公開されます。</text>
  <text x="56" y="492" font-size="16" fill="#5E524D">審査は通常10分以内。最長で30日ほどかかることもあります。</text>
</svg>
