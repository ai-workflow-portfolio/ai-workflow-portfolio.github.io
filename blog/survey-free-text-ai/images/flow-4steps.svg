<svg width="640" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <rect width="640" height="470" fill="#FFFFFF"/>
  <g font-size="22" fill="#3B3230">
    <!-- 1 -->
    <rect x="16" y="16" width="608" height="88" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <circle cx="62" cy="60" r="22" fill="#8C6F45"/><text x="62" y="68" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">1</text>
    <text x="104" y="54" font-weight="700">お客様が分かる情報を消す</text>
    <text x="104" y="84" font-size="17" fill="#5E524D">名前・連絡先を消した「写し」を作る</text>
    <rect x="520" y="38" width="86" height="34" rx="17" fill="#F5EBE7" stroke="#96594F"/><text x="563" y="62" text-anchor="middle" font-size="17" fill="#96594F" font-weight="700">自分</text>
    <path d="M320 104v26" stroke="#948072" stroke-width="2.5"/><path d="M312 124l8 10 8-10" fill="none" stroke="#948072" stroke-width="2.5"/>
    <!-- 2 -->
    <rect x="16" y="138" width="608" height="88" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <circle cx="62" cy="182" r="22" fill="#8C6F45"/><text x="62" y="190" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">2</text>
    <text x="104" y="176" font-weight="700">分け方の案を出してもらう</text>
    <text x="104" y="206" font-size="17" fill="#5E524D">どの分け方にするかは、自分で決める</text>
    <rect x="456" y="160" width="68" height="34" rx="17" fill="#E9EEF2" stroke="#4A6478"/><text x="490" y="184" text-anchor="middle" font-size="17" fill="#35505F" font-weight="700">AI</text>
    <rect x="532" y="160" width="74" height="34" rx="17" fill="#F5EBE7" stroke="#96594F"/><text x="569" y="184" text-anchor="middle" font-size="17" fill="#96594F" font-weight="700">自分</text>
    <path d="M320 226v26" stroke="#948072" stroke-width="2.5"/><path d="M312 246l8 10 8-10" fill="none" stroke="#948072" stroke-width="2.5"/>
    <!-- 3 -->
    <rect x="16" y="260" width="608" height="88" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <circle cx="62" cy="304" r="22" fill="#8C6F45"/><text x="62" y="312" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">3</text>
    <text x="104" y="298" font-weight="700">決めた分け方で、1件ずつ分類</text>
    <text x="104" y="328" font-size="17" fill="#5E524D">番号・分類・理由の表で出してもらう</text>
    <rect x="520" y="282" width="86" height="34" rx="17" fill="#E9EEF2" stroke="#4A6478"/><text x="563" y="306" text-anchor="middle" font-size="17" fill="#35505F" font-weight="700">AI</text>
    <path d="M320 348v26" stroke="#948072" stroke-width="2.5"/><path d="M312 368l8 10 8-10" fill="none" stroke="#948072" stroke-width="2.5"/>
    <!-- 4 -->
    <rect x="16" y="382" width="608" height="72" rx="6" fill="#FAF7F3" stroke="#948072"/>
    <circle cx="62" cy="418" r="22" fill="#8C6F45"/><text x="62" y="426" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">4</text>
    <text x="104" y="412" font-weight="700">件数は表計算で数え直す</text>
    <text x="104" y="440" font-size="17" fill="#5E524D">準備メモはたたき台。最後は自分で見直す</text>
    <rect x="456" y="400" width="68" height="34" rx="17" fill="#F5EBE7" stroke="#96594F"/><text x="490" y="424" text-anchor="middle" font-size="17" fill="#96594F" font-weight="700">自分</text>
    <rect x="532" y="400" width="74" height="34" rx="17" fill="#E9EEF2" stroke="#4A6478"/><text x="569" y="424" text-anchor="middle" font-size="17" fill="#35505F" font-weight="700">AI</text>
  </g>
</svg>
